<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Asal Sekolah</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f9f9f9; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        input, select, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #218838; }
        .btn-edit { background-color: #ffc107; color: black; width: auto; padding: 5px 10px; margin-right: 5px; }
        .btn-delete { background-color: #dc3545; color: white; width: auto; padding: 5px 10px; }
        .btn-cancel { background-color: #6c757d; color: white; width: auto; padding: 5px 10px; margin-top: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h2>Manajemen Asal Sekolah</h2>

    <!-- BAGIAN 1: FORM LOGIN ADMIN -->
    <div class="card" id="section-login">
        <h3>Login Admin</h3>
        <form id="form-login">
            <input type="text" id="login-username" placeholder="Username Admin" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="login-status" style="color: red;"></p>
    </div>

    <!-- BAGIAN 2: FORM TAMBAH / EDIT DATA (Hanya muncul setelah login) -->
    <div class="card hidden" id="section-tambah">
        <h3 id="form-title">Tambah Asal Sekolah Baru</h3>
        <button onclick="logout()" style="background-color: #dc3545; width: auto; padding: 5px 10px; float: right;">Logout</button>
        
        <form id="form-sekolah">
            <!-- Hidden input untuk menyimpan ID saat mode Edit -->
            <input type="hidden" id="sekolah-id">
            
            <input type="text" id="nama-sekolah" placeholder="Nama Sekolah (cth: SMAN 1 Teladan)" required>
            <select id="jenis-sekolah" required>
                <option value="">Pilih Jenis Sekolah</option>
                <option value="SMA">SMA</option>
                <option value="SMK">SMK</option>
                <option value="MA">MA</option>
            </select>
            <input type="text" id="kabupaten" placeholder="Kabupaten" required>
            
            <button type="submit" id="btn-submit">Simpan Data</button>
            <button type="button" id="btn-batal" class="btn-cancel hidden" onclick="resetForm()">Batal Edit</button>
        </form>
    </div>

    <!-- BAGIAN 3: TABEL DAFTAR SEKOLAH -->
    <div class="card">
        <h3>Daftar Asal Sekolah</h3>
        <table>
            <thead>
                <tr>
                    <th>Nama Sekolah</th>
                    <th>Jenis</th>
                    <th>Kabupaten</th>
                    <th id="th-aksi" class="hidden">Aksi</th>
                </tr>
            </thead>
            <tbody id="tabel-data">
                <!-- Data akan masuk otomatis dari backend -->
            </tbody>
        </table>
    </div>

    <script>
        // Menggunakan IP Laptop kamu agar bisa diakses oleh teman (frontend)
        const API_URL = 'https://bumpy-signs-turn.loca.lt';

        // Cek status login dan ambil data saat halaman dibuka
        document.addEventListener("DOMContentLoaded", () => {
            cekToken();
            ambilDataSekolah();

            // SENSOR OTOMATIS: Saat mengetik Nama Sekolah, otomatis pilih Jenis Sekolah
            const inputNama = document.getElementById('nama-sekolah');
            const selectJenis = document.getElementById('jenis-sekolah');

            inputNama.addEventListener('input', () => {
                const teks = inputNama.value.toUpperCase();
                
                if (teks.includes('SMK')) {
                    selectJenis.value = 'SMK';
                } else if (teks.includes('SMA')) {
                    selectJenis.value = 'SMA';
                } else if (teks.includes('MA') && !teks.includes('SMK') && !teks.includes('SMA')) {
                    selectJenis.value = 'MA';
                }
            });
        });

        function cekToken() {
            const token = localStorage.getItem('admin_token');
            const thAksi = document.getElementById('th-aksi');

            if (token) {
                document.getElementById('section-login').classList.add('hidden');
                document.getElementById('section-tambah').classList.remove('hidden');
                if (thAksi) thAksi.classList.remove('hidden');
            } else {
                document.getElementById('section-login').classList.remove('hidden');
                document.getElementById('section-tambah').classList.add('hidden');
                if (thAksi) thAksi.classList.add('hidden');
            }
        }

        // 1. PROSES LOGIN
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('admin_token', data.token);
                    alert('Login Berhasil sebagai Admin!');
                    document.getElementById('login-status').innerText = '';
                    cekToken();
                    ambilDataSekolah();
                } else {
                    document.getElementById('login-status').innerText = data.message || 'Login gagal';
                }
            } catch (err) {
                console.error(err);
                alert('Gagal terhubung ke server backend.');
            }
        });

        // 2. LOGOUT
        function logout() {
            localStorage.removeItem('admin_token');
            alert('Berhasil Logout');
            resetForm();
            cekToken();
            ambilDataSekolah();
        }

        // 3. AMBIL DATA SEKOLAH (GET)
        async function ambilDataSekolah() {
            try {
                const res = await fetch(`${API_URL}/api/asal-sekolah`);
                const hasil = await res.json();
                const tbody = document.getElementById('tabel-data');
                const token = localStorage.getItem('admin_token');
                
                tbody.innerHTML = '';

                if (!hasil.data || hasil.data.length === 0) {
                    const colspan = token ? 4 : 3;
                    tbody.innerHTML = `<tr><td colspan="${colspan}" style="text-align: center; color: #777;">Belum ada data sekolah.</td></tr>`;
                    return;
                }

                hasil.data.forEach(item => {
                    let aksiTd = '';
                    if (token) {
                        aksiTd = `<td>
                            <button class="btn-edit" onclick="persiapkanEdit(${item.id}, '${item.nama_sekolah}', '${item.jenis_sekolah}', '${item.kabupaten}')">Edit</button>
                            <button class="btn-delete" onclick="hapusSekolah(${item.id})">Hapus</button>
                        </td>`;
                    }

                    tbody.innerHTML += `<tr>
                        <td>${item.nama_sekolah}</td>
                        <td>${item.jenis_sekolah}</td>
                        <td>${item.kabupaten}</td>
                        ${aksiTd}
                    </tr>`;
                });
            } catch (err) {
                console.error('Gagal mengambil data:', err);
            }
        }

        // 4. SIMPAN DATA (CREATE / UPDATE dengan Konfirmasi Validasi)
        document.getElementById('form-sekolah').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('sekolah-id').value;
            const nama_sekolah = document.getElementById('nama-sekolah').value;
            let jenis_sekolah = document.getElementById('jenis-sekolah').value;
            const kabupaten = document.getElementById('kabupaten').value;
            const token = localStorage.getItem('admin_token');

            // VALIDASI SINGKRONISASI
            const namaUpper = nama_sekolah.toUpperCase();
            if (namaUpper.includes('SMA') && jenis_sekolah !== 'SMA') {
                if (confirm(`Nama sekolah berisi "SMA", tapi Jenis dipilih "${jenis_sekolah}". Ubah jenis sekolah menjadi "SMA"?`)) {
                    jenis_sekolah = 'SMA';
                    document.getElementById('jenis-sekolah').value = 'SMA';
                }
            } else if (namaUpper.includes('SMK') && jenis_sekolah !== 'SMK') {
                if (confirm(`Nama sekolah berisi "SMK", tapi Jenis dipilih "${jenis_sekolah}". Ubah jenis sekolah menjadi "SMK"?`)) {
                    jenis_sekolah = 'SMK';
                    document.getElementById('jenis-sekolah').value = 'SMK';
                }
            }

            const isEdit = id !== '';
            const endpoint = isEdit ? `${API_URL}/api/asal-sekolah/${id}` : `${API_URL}/api/asal-sekolah`;
            const method = isEdit ? 'PUT' : 'POST';

            try {
                const res = await fetch(endpoint, {
                    method: method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ nama_sekolah, jenis_sekolah, kabupaten })
                });

                const hasil = await res.json();
                if (res.ok) {
                    alert(isEdit ? 'Data berhasil diperbarui!' : 'Data asal sekolah berhasil ditambahkan!');
                    resetForm();
                    ambilDataSekolah();
                } else {
                    alert('Gagal: ' + hasil.message);
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan saat menyimpan data.');
            }
        });

        // 5. EDIT DATA
        function persiapkanEdit(id, nama, jenis, kabupaten) {
            document.getElementById('sekolah-id').value = id;
            document.getElementById('nama-sekolah').value = nama;
            document.getElementById('jenis-sekolah').value = jenis;
            document.getElementById('kabupaten').value = kabupaten;

            document.getElementById('form-title').innerText = 'Edit Asal Sekolah';
            document.getElementById('btn-submit').innerText = 'Update Data';
            document.getElementById('btn-batal').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 6. RESET FORM
        function resetForm() {
            document.getElementById('sekolah-id').value = '';
            document.getElementById('form-sekolah').reset();
            document.getElementById('form-title').innerText = 'Tambah Asal Sekolah Baru';
            document.getElementById('btn-submit').innerText = 'Simpan Data';
            document.getElementById('btn-batal').classList.add('hidden');
        }

        // 7. HAPUS DATA (DELETE)
        async function hapusSekolah(id) {
            if (!confirm('Apakah Anda yakin ingin menghapus data ini?')) return;

            const token = localStorage.getItem('admin_token');

            try {
                const res = await fetch(`${API_URL}/api/asal-sekolah/${id}`, {
                    method: 'DELETE',
                    headers: { 
                        'Authorization': `Bearer ${token}`
                    }
                });

                const hasil = await res.json();
                if (res.ok) {
                    alert('Data berhasil dihapus!');
                    ambilDataSekolah();
                } else {
                    alert('Gagal menghapus: ' + hasil.message);
                }
            } catch (err) {
                console.error(err);
                alert('Terjadi kesalahan saat menghapus data.');
            }
        }
    </script>
</body>
</html>
